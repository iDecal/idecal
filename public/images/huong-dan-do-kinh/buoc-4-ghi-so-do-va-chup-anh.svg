<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Ghi số đo &amp; chụp ảnh</title><desc id="desc">Gửi ảnh cùng bảng số đo để được tư vấn đúng vùng cần dán. Số đo sơ bộ cần xác nhận trước khi đặt làm.</desc><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e6f4fa"/><stop offset="1" stop-color="#f5f9fc"/></linearGradient><linearGradient id="wash"><stop stop-color="#f0f8fd"/><stop offset="1" stop-color="#f5f1fc"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#147fc0" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="920" rx="0" fill="#fff" /><rect x="36" y="32" width="1128" height="856" rx="24" fill="#fff" stroke="#dfeaf1" stroke-width="2"/><rect x="68" y="64" width="68" height="56" rx="18" fill="url(#wash)" /><text x="102" y="102" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">04</text><text x="160" y="104" font-size="43" fill="#163f5c" font-weight="700" text-anchor="start">Ghi số đo &amp; chụp ảnh</text><text x="70" y="155" font-size="25" fill="#557084" font-weight="400" text-anchor="start">Gửi ảnh cùng bảng số đo để được tư vấn đúng vùng cần dán.</text><rect x="82" y="245" width="610" height="350" rx="18" fill="#f6f9fc" /><rect x="82" y="245" width="610" height="72" rx="18" fill="#e9f3fa" /><text x="120" y="292" font-size="30" fill="#163f5c" font-weight="700" text-anchor="start">Ô kính</text><text x="312" y="292" font-size="30" fill="#163f5c" font-weight="700" text-anchor="start">Rộng</text><text x="505" y="292" font-size="30" fill="#163f5c" font-weight="700" text-anchor="start">Cao</text><text x="120" y="370" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">Ô 1</text><text x="312" y="370" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">120 cm</text><text x="505" y="370" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">200 cm</text><text x="120" y="455" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">Ô 2</text><text x="312" y="455" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">80 cm</text><text x="505" y="455" font-size="30" fill="#163f5c" font-weight="400" text-anchor="start">200 cm</text><line x1="106" y1="405" x2="670" y2="405" stroke="#d9e5ed" stroke-width="2" /><text x="120" y="555" font-size="30" fill="#147fc0" font-weight="700" text-anchor="start">Ghi cùng một đơn vị</text><rect x="800" y="220" width="260" height="395" rx="30" fill="#264d67" /><rect x="813" y="247" width="234" height="335" rx="14" fill="#fff" /><rect x="836" y="271" width="188" height="268" rx="7" fill="#b8c7cf" /><rect x="844" y="279" width="172" height="252" rx="3" fill="#e4ebef" /><rect x="850" y="285" width="160" height="240" rx="0" fill="url(#glass)" /><line x1="875" y1="453.0" x2="938.0" y2="315" stroke="#ffffff" stroke-width="5" /><line x1="914.0" y1="495" x2="985" y2="357.0" stroke="#ffffff" stroke-width="3" /><rect x="890" y="232" width="80" height="6" rx="3" fill="#d6e6ef" /><text x="82" y="680" font-size="33" fill="#163f5c" font-weight="700" text-anchor="start">Ảnh cần gửi</text><text x="86" y="730" font-size="30" fill="#147fc0" font-weight="700" text-anchor="start">✓</text><text x="127" y="730" font-size="29" fill="#163f5c" font-weight="400" text-anchor="start">Toàn cảnh có đánh số ô</text><text x="86" y="775" font-size="30" fill="#147fc0" font-weight="700" text-anchor="start">✓</text><text x="127" y="775" font-size="29" fill="#163f5c" font-weight="400" text-anchor="start">Mép khung, tay nắm và lớp decal cũ (nếu có)</text><line x1="70" y1="825" x2="1130" y2="825" stroke="#e4edf3" stroke-width="2" /><text x="70" y="868" font-size="26" fill="#163f5c" font-weight="400" text-anchor="start">Số đo sơ bộ cần xác nhận trước khi đặt làm.</text><text x="1115" y="868" font-size="25" fill="#147fc0" font-weight="700" text-anchor="end">iDecal</text></g></svg>