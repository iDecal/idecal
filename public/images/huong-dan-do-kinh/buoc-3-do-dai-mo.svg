<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Nếu chỉ dán một phần kính</title><desc id="desc">Ghi thêm chiều cao dải dán và vị trí của dải so với sàn. Đánh dấu vùng cần dán trên ảnh để tránh nhầm vị trí.</desc><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e6f4fa"/><stop offset="1" stop-color="#f5f9fc"/></linearGradient><linearGradient id="wash"><stop stop-color="#f0f8fd"/><stop offset="1" stop-color="#f5f1fc"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#147fc0" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="920" rx="0" fill="#fff" /><rect x="36" y="32" width="1128" height="856" rx="24" fill="#fff" stroke="#dfeaf1" stroke-width="2"/><rect x="68" y="64" width="68" height="56" rx="18" fill="url(#wash)" /><text x="102" y="102" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">03</text><text x="160" y="104" font-size="43" fill="#163f5c" font-weight="700" text-anchor="start">Nếu chỉ dán một phần kính</text><text x="70" y="155" font-size="25" fill="#557084" font-weight="400" text-anchor="start">Ghi thêm chiều cao dải dán và vị trí của dải so với sàn.</text><rect x="336" y="231" width="528" height="518" rx="7" fill="#b8c7cf" /><rect x="344" y="239" width="512" height="502" rx="3" fill="#e4ebef" /><rect x="350" y="245" width="500" height="490" rx="0" fill="url(#glass)" /><line x1="375" y1="588.0" x2="625.0" y2="275" stroke="#ffffff" stroke-width="5" /><line x1="550.0" y1="705" x2="825" y2="392.0" stroke="#ffffff" stroke-width="3" /><rect x="350" y="415" width="500" height="155" rx="0" fill="#b9dce9" fill-opacity=".85"/><text x="600" y="505" font-size="29" fill="#163f5c" font-weight="700" text-anchor="middle">VÙNG DỰ KIẾN DÁN</text><line x1="350" y1="205" x2="850" y2="205" stroke="#147fc0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="600" y="186" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">Rộng ô kính</text><line x1="910" y1="415" x2="910" y2="570" stroke="#147fc0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="850" y1="415" x2="925" y2="415" stroke="#83b9d5" stroke-width="2" /><line x1="850" y1="570" x2="925" y2="570" stroke="#83b9d5" stroke-width="2" /><text x="946" y="475" font-size="27" fill="#147fc0" font-weight="700" text-anchor="start">Cao dải</text><text x="946" y="513" font-size="27" fill="#147fc0" font-weight="700" text-anchor="start">dán</text><line x1="160" y1="780" x2="1050" y2="780" stroke="#9faeb9" stroke-width="4" /><text x="980" y="815" font-size="23" fill="#557084" font-weight="700" text-anchor="start">SÀN</text><line x1="260" y1="570" x2="260" y2="780" stroke="#147fc0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="245" y1="570" x2="350" y2="570" stroke="#83b9d5" stroke-width="2" stroke-dasharray="6 5"/><text x="82" y="641" font-size="27" fill="#147fc0" font-weight="700" text-anchor="start">Từ sàn</text><text x="82" y="679" font-size="27" fill="#147fc0" font-weight="700" text-anchor="start">đến mép</text><text x="82" y="717" font-size="27" fill="#147fc0" font-weight="700" text-anchor="start">dưới dải</text><line x1="70" y1="825" x2="1130" y2="825" stroke="#e4edf3" stroke-width="2" /><text x="70" y="868" font-size="26" fill="#163f5c" font-weight="400" text-anchor="start">Đánh dấu vùng cần dán trên ảnh để tránh nhầm vị trí.</text><text x="1115" y="868" font-size="25" fill="#147fc0" font-weight="700" text-anchor="end">iDecal</text></g></svg>