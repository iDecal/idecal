<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Đo rộng × cao</title><desc id="desc">Đo phần kính dự kiến dán; giữ thước thẳng và sát mặt kính. Ví dụ minh họa • Ghi rõ đơn vị cm, mm hoặc m.</desc><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e6f4fa"/><stop offset="1" stop-color="#f5f9fc"/></linearGradient><linearGradient id="wash"><stop stop-color="#f0f8fd"/><stop offset="1" stop-color="#f5f1fc"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#147fc0" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="920" rx="0" fill="#fff" /><rect x="36" y="32" width="1128" height="856" rx="24" fill="#fff" stroke="#dfeaf1" stroke-width="2"/><rect x="68" y="64" width="68" height="56" rx="18" fill="url(#wash)" /><text x="102" y="102" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">02</text><text x="160" y="104" font-size="43" fill="#163f5c" font-weight="700" text-anchor="start">Đo rộng × cao</text><text x="70" y="155" font-size="25" fill="#557084" font-weight="400" text-anchor="start">Đo phần kính dự kiến dán; giữ thước thẳng và sát mặt kính.</text><rect x="391" y="231" width="328" height="528" rx="7" fill="#b8c7cf" /><rect x="399" y="239" width="312" height="512" rx="3" fill="#e4ebef" /><rect x="405" y="245" width="300" height="500" rx="0" fill="url(#glass)" /><line x1="430" y1="595.0" x2="570.0" y2="275" stroke="#ffffff" stroke-width="5" /><line x1="525.0" y1="715" x2="680" y2="395.0" stroke="#ffffff" stroke-width="3" /><line x1="405" y1="205" x2="705" y2="205" stroke="#147fc0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="555" y="188" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">RỘNG 120 cm</text><line x1="405" y1="215" x2="405" y2="245" stroke="#83b9d5" stroke-width="2" /><line x1="705" y1="215" x2="705" y2="245" stroke="#83b9d5" stroke-width="2" /><line x1="800" y1="245" x2="800" y2="745" stroke="#147fc0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="705" y1="245" x2="815" y2="245" stroke="#83b9d5" stroke-width="2" /><line x1="705" y1="745" x2="815" y2="745" stroke="#83b9d5" stroke-width="2" /><text x="835" y="475" font-size="29" fill="#147fc0" font-weight="700" text-anchor="start">CAO</text><text x="835" y="515" font-size="34" fill="#147fc0" font-weight="700" text-anchor="start">200 cm</text><rect x="90" y="405" width="260" height="148" rx="16" fill="#f1f7fc" /><text x="112" y="450" font-size="27" fill="#163f5c" font-weight="500" text-anchor="start">Đo từ mép kính</text><text x="112" y="490" font-size="27" fill="#163f5c" font-weight="500" text-anchor="start">đến mép kính,</text><text x="112" y="530" font-size="27" fill="#163f5c" font-weight="500" text-anchor="start">phía trong khung.</text><line x1="350" y1="435" x2="405" y2="435" stroke="#147fc0" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="795" font-size="28" fill="#163f5c" font-weight="500" text-anchor="middle">Ô 1 = rộng 120 × cao 200 cm</text><line x1="70" y1="825" x2="1130" y2="825" stroke="#e4edf3" stroke-width="2" /><text x="70" y="868" font-size="26" fill="#163f5c" font-weight="400" text-anchor="start">Ví dụ minh họa • Ghi rõ đơn vị cm, mm hoặc m.</text><text x="1115" y="868" font-size="25" fill="#147fc0" font-weight="700" text-anchor="end">iDecal</text></g></svg>