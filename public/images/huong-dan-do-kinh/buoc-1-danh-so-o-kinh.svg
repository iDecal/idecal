<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Đánh số từng ô kính</title><desc id="desc">Tách riêng các ô có khung ngăn; không đo gộp cả bộ cửa. Ghi riêng từng ô kính, không cộng cả phần khung.</desc><defs><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#e6f4fa"/><stop offset="1" stop-color="#f5f9fc"/></linearGradient><linearGradient id="wash"><stop stop-color="#f0f8fd"/><stop offset="1" stop-color="#f5f1fc"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#147fc0" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="920" rx="0" fill="#fff" /><rect x="36" y="32" width="1128" height="856" rx="24" fill="#fff" stroke="#dfeaf1" stroke-width="2"/><rect x="68" y="64" width="68" height="56" rx="18" fill="url(#wash)" /><text x="102" y="102" font-size="29" fill="#147fc0" font-weight="700" text-anchor="middle">01</text><text x="160" y="104" font-size="43" fill="#163f5c" font-weight="700" text-anchor="start">Đánh số từng ô kính</text><text x="70" y="155" font-size="25" fill="#557084" font-weight="400" text-anchor="start">Tách riêng các ô có khung ngăn; không đo gộp cả bộ cửa.</text><rect x="140" y="276" width="268" height="413" rx="7" fill="#b8c7cf" /><rect x="148" y="284" width="252" height="397" rx="3" fill="#e4ebef" /><rect x="154" y="290" width="240" height="385" rx="0" fill="url(#glass)" /><line x1="179" y1="559.5" x2="286.0" y2="320" stroke="#ffffff" stroke-width="5" /><line x1="250.0" y1="645" x2="369" y2="405.5" stroke="#ffffff" stroke-width="3" /><rect x="182" y="322" width="110" height="64" rx="12" fill="#fff" stroke="#c9dfeb" stroke-width="2"/><text x="237" y="365" font-size="33" fill="#147fc0" font-weight="700" text-anchor="middle">Ô 1</text><rect x="466" y="276" width="268" height="413" rx="7" fill="#b8c7cf" /><rect x="474" y="284" width="252" height="397" rx="3" fill="#e4ebef" /><rect x="480" y="290" width="240" height="385" rx="0" fill="url(#glass)" /><line x1="505" y1="559.5" x2="612.0" y2="320" stroke="#ffffff" stroke-width="5" /><line x1="576.0" y1="645" x2="695" y2="405.5" stroke="#ffffff" stroke-width="3" /><rect x="508" y="322" width="110" height="64" rx="12" fill="#fff" stroke="#c9dfeb" stroke-width="2"/><text x="563" y="365" font-size="33" fill="#147fc0" font-weight="700" text-anchor="middle">Ô 2</text><rect x="792" y="276" width="268" height="413" rx="7" fill="#b8c7cf" /><rect x="800" y="284" width="252" height="397" rx="3" fill="#e4ebef" /><rect x="806" y="290" width="240" height="385" rx="0" fill="url(#glass)" /><line x1="831" y1="559.5" x2="938.0" y2="320" stroke="#ffffff" stroke-width="5" /><line x1="902.0" y1="645" x2="1021" y2="405.5" stroke="#ffffff" stroke-width="3" /><rect x="834" y="322" width="110" height="64" rx="12" fill="#fff" stroke="#c9dfeb" stroke-width="2"/><text x="889" y="365" font-size="33" fill="#147fc0" font-weight="700" text-anchor="middle">Ô 3</text><line x1="180" y1="230" x2="1020" y2="230" stroke="#147fc0" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="210" font-size="28" fill="#147fc0" font-weight="500" text-anchor="middle">Đánh số từ trái sang phải</text><text x="600" y="750" font-size="30" fill="#163f5c" font-weight="500" text-anchor="middle">Ô 1  •  Ô 2  •  Ô 3 = ba vùng đo riêng biệt</text><line x1="70" y1="825" x2="1130" y2="825" stroke="#e4edf3" stroke-width="2" /><text x="70" y="868" font-size="26" fill="#163f5c" font-weight="400" text-anchor="start">Ghi riêng từng ô kính, không cộng cả phần khung.</text><text x="1115" y="868" font-size="25" fill="#147fc0" font-weight="700" text-anchor="end">iDecal</text></g></svg>